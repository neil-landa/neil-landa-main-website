<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site admin | Neil Landa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>
  <header class="top">
    <a class="top-brand" href="/admin/">
      <img id="top-logo" src="/assets/lion.svg" alt="" width="30" height="30">
      <span>Site admin</span>
    </a>
    <div class="top-end">
      <span class="who" id="who"></span>
      <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">View site ↗</a>
      <a class="btn btn-ghost" href="/logout">Sign out</a>
      <button class="btn btn-blue" id="save" type="button" disabled>Save changes</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="main" id="main">
      <p class="loading">Loading…</p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js?v=2" defer></script>
</body>
</html>
